{% set settings = logistics_settings[version.id] %}
<div>
  <h4 class="text-xs font-bold text-[#A3AED0] uppercase tracking-wider mb-3">물류 기준 설정</h4>
  <form method="post" action="{{ url_for('admin.set_logistics_settings', bom_id=version.id) }}" class="admin-logistics-settings-form">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">박스 가로(mm)</label><input type="number" step="any" name="box_width" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.box_width or '' }}"></div>
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">박스 세로(mm)</label><input type="number" step="any" name="box_depth" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.box_depth or '' }}"></div>
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">박스 높이(mm)</label><input type="number" step="any" name="box_height" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.box_height or '' }}"></div>
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">컨테이너당 박스수</label><input type="number" step="any" name="boxes_per_container" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.boxes_per_container or '' }}"></div>
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">컨테이너 중량한도(kg)</label><input type="number" step="any" name="container_weight_limit_kg" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.container_weight_limit_kg or '' }}"></div>
      <div><label class="text-xs font-medium text-[#A3AED0] mb-1 block">수출포장비(원/대포장)</label><input type="number" step="any" name="export_packaging_cost" class="input input-bordered input-sm rounded-xl w-full" value="{{ settings.export_packaging_cost or '' }}"></div>
    </div>
    <div class="flex justify-end"><button class="btn btn-ghost btn-sm rounded-xl">물류 기준 저장</button></div>
  </form>
</div>
