{% extends "base_new.html" %}
{% block title %}로그인 - TMS Portal{% endblock %}
{% block guest_content %}
<div class="w-full max-w-sm bg-white rounded-2xl p-6 md:p-8 shadow-sm border-none">
    <div class="flex flex-col items-center gap-2 mb-6">
        <i class="bi bi-boxes text-3xl text-blue-600"></i>
        <h1 class="text-xl font-extrabold text-[#1B2559]">TMS Portal</h1>
    </div>
    {% if error %}
    <div class="bg-rose-50 border border-rose-200 text-rose-600 rounded-2xl shadow-sm mb-4 flex items-center gap-3 p-4">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span class="text-sm font-semibold">{{ error }}</span>
    </div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
            <label class="text-sm font-medium text-[#1B2559] block mb-1">아이디</label>
            <input type="text" name="username" class="input input-bordered w-full rounded-xl bg-base-100 border-base-300 focus:border-primary focus:outline-none transition-all text-sm" required autofocus>
        </div>
        <div class="mb-4">
            <label class="text-sm font-medium text-[#1B2559] block mb-1">비밀번호</label>
            <input type="password" name="password" class="input input-bordered w-full rounded-xl bg-base-100 border-base-300 focus:border-primary focus:outline-none transition-all text-sm" required>
        </div>
        <button type="submit" class="btn btn-primary rounded-xl px-6 font-bold shadow-md shadow-blue-100 hover:shadow-none w-full">로그인</button>
    </form>
</div>
{% endblock %}
