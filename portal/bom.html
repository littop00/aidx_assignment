<script>
document.addEventListener('click', async (event) => {
  const button = event.target.closest('.group-toggle');
  if (!button) return;
  try {
    const response = await fetch(button.dataset.url, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json'}, body: new URLSearchParams({enabled: button.dataset.enabled})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.message);
    htmx.trigger(document.getElementById('filter-form'), 'change');
  } catch (error) { alert(error.message || '그룹 변경에 실패했습니다.'); }
});
function refreshAssignmentAccess(initialize = false) {
  document.querySelectorAll('.assignment-toggle').forEach((checkbox) => {
    if (initialize && !checkbox.dataset.saved) checkbox.dataset.saved = checkbox.checked ? 'true' : 'false';
    const isSavedAssignment = checkbox.dataset.saved === 'true';
    checkbox.closest('tr').querySelectorAll('.row-autosave, .save-row-btn').forEach((field) => { field.disabled = !isSavedAssignment; });
  });
  const saveButton = document.getElementById('save-assignments-btn');
  if (saveButton) saveButton.disabled = ![...document.querySelectorAll('.assignment-toggle')].some((checkbox) => checkbox.checked !== (checkbox.dataset.saved === 'true'));
}
document.addEventListener('click', (event) => {
  if (event.target.id !== 'toggle-bom-detail') return;
  const open = event.target.dataset.open !== '1';
  document.querySelectorAll('.part-name-cell details').forEach((item) => { item.open = open; });
  event.target.dataset.open = open ? '1' : '0';
  event.target.textContent = open ? '상세 BOM 숨기기' : '상세 BOM 표시';
});
document.addEventListener('htmx:afterSwap', () => refreshAssignmentAccess(true));
document.addEventListener('change', (event) => {
  if (event.target.id === 'select-all') {
    document.querySelectorAll('.assignment-toggle').forEach((checkbox) => { checkbox.checked = event.target.checked; });
    refreshAssignmentAccess();
    return;
  }
  if (event.target.matches('.assignment-toggle')) refreshAssignmentAccess();
});
document.addEventListener('click', async (event) => {
  const resetButton = event.target.closest('#reset-my-work-btn');
  if (resetButton) {
    if (!confirm('담당 품목과 지금까지 저장한 재료단가를 모두 삭제합니다. 계속하시겠습니까?')) return;
    resetButton.disabled = true;
    try {
      const response = await fetch('/bom/reset-work', {method: 'POST', headers: {'Accept': 'application/json'}});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || '초기화에 실패했습니다.');
      alert(payload.message);
      htmx.trigger(document.getElementById('filter-form'), 'change');
    } catch (error) {
      alert(error.message);
      resetButton.disabled = false;
    }
    return;
  }
  const button = event.target.closest('#save-assignments-btn');
  if (!button) return;
  const changed = [...document.querySelectorAll('.assignment-toggle')].filter((checkbox) => checkbox.checked !== (checkbox.dataset.saved === 'true'));
  if (!changed.length) return;
  button.disabled = true;
  try {
    const results = await Promise.all(changed.map(async (checkbox) => {
      const response = await fetch(checkbox.dataset.url, {method: 'POST', headers: {'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({assigned: checkbox.checked ? '1' : '0'})});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || '담당 품목 저장에 실패했습니다.');
      return payload;
    }));
    changed.forEach((checkbox) => { checkbox.dataset.saved = checkbox.checked ? 'true' : 'false'; });
    refreshAssignmentAccess();
    alert(`담당 품목 ${results.at(-1).count}건을 저장했습니다.`);
  } catch (error) {
    alert(error.message);
    refreshAssignmentAccess();
  }
});
document.addEventListener('DOMContentLoaded', () => refreshAssignmentAccess(true));

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    const AUTOSAVE_DELAY_MS = 150;

    function formatAmount(value) {
        return new Intl.NumberFormat("ko-KR", {maximumFractionDigits: 0}).format(Number(value || 0));
    }

    function updateSavedRow(row, payload) {
        if (payload.countries) {
            Object.entries(payload.countries).forEach(([country, values]) => {
                ["material_cost", "logistics_cost", "total_cost"].forEach((name) => {
                    const cell = row.querySelector(`[data-cost="${country}__${name}"]`);
                    if (cell) cell.textContent = formatAmount(values[name]);
                });
            });
        }
        ["material_cost", "logistics_cost", "total_cost"].forEach((name) => {
            const cell = row.querySelector(`[data-cost="${name}"]`);
            if (cell) cell.textContent = formatAmount(payload[name]);
        });
        const badge = row.querySelector(".status-done, .status-missing");
        if (badge) {
            badge.className = `badge ${payload.status_done ? "status-done" : "status-missing"}`;
            badge.innerHTML = payload.status_done
                ? '<i class="bi bi-check-circle"></i> 입력 완료'
                : '<i class="bi bi-exclamation-circle"></i> 미입력';
        }
        const status = row.querySelector(".row-save-message");
        if (status) status.textContent = payload.error ? `Input error: ${payload.error}` : "Saved";
        const button = row.querySelector(".save-row-btn");
        if (button) button.innerHTML = payload.error
            ? '<i class="bi bi-exclamation-triangle"></i> Error'
            : '<i class="bi bi-check2"></i> Saved';
        row.classList.toggle("row-save-error", Boolean(payload.error));
    }

    function showSaveMessage(message, isError = false) {
        const slot = document.getElementById("toast-slot");
        if (!slot) return;
        slot.innerHTML = `<div class="toast-item ${isError ? "toast-error" : "toast-success"}">${message}</div>`;
        window.setTimeout(() => { slot.innerHTML = ""; }, 2500);
    }

    async function saveRow(row, showSuccess = false) {
        if (!row || row.dataset.saving === "true") return;
        row.dataset.saving = "true";
        const button = row.querySelector(".save-row-btn");
        const data = new URLSearchParams();
        row.querySelectorAll("[name]").forEach((field) => data.append(field.name, field.value));
        try {
            const response = await fetch(row.dataset.saveUrl, {
                method: "POST",
                credentials: "same-origin",
                headers: {"Accept": "application/json", "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"},
                body: data.toString(),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            updateSavedRow(row, payload);
            row.dataset.saving = "false";
            if (showSuccess) showSaveMessage("&#51200;&#51109;&#46104;&#50632;&#49845;&#45768;&#45796;.");
        } catch (error) {
            console.error("BOM row save failed", error);
            row.dataset.saving = "false";
            showSaveMessage("&#51200;&#51109;&#50640; &#49892;&#54056;&#54664;&#49845;&#45768;&#45796;. &#45796;&#49884; &#49884;&#46020;&#54644; &#51452;&#49464;&#50836;.", true);
        }
    }
    window.saveBomRow = saveRow;

    document.addEventListener("input", (event) => {
        const field = event.target.closest(".row-autosave");
        if (!field) return;
        const row = field.closest("tr[data-save-url]");
        window.clearTimeout(field._bomSaveTimer);
        field._bomSaveTimer = window.setTimeout(() => saveRow(row), AUTOSAVE_DELAY_MS);
    });

    document.addEventListener("change", (event) => {
        if (event.target.id === "select-all") {
            document.querySelectorAll("#grid-container .row-select:not(:disabled)").forEach((box) => { box.checked = event.target.checked; });
            return;
        }
        const field = event.target.closest(".row-autosave");
        if (field) saveRow(field.closest("tr[data-save-url]"));
    });

    document.addEventListener("click", (event) => {
        const bulkApply = event.target.closest("#bulk-apply-btn");
        const bulkSave = event.target.closest("#bulk-save-btn");
        if (bulkApply || bulkSave) {
            event.preventDefault();
            const rows = [...document.querySelectorAll("#grid-container tr[data-save-url]")].filter((row) => row.querySelector(".row-select")?.checked);
            if (!rows.length) { showSaveMessage("적용할 행을 먼저 선택해 주세요.", true); return; }
            if (bulkApply) {
                const country = document.getElementById("bulk-country")?.value;
                const field = document.getElementById("bulk-field")?.value;
                const value = document.getElementById("bulk-value")?.value;
                if (value === "") { showSaveMessage("일괄 적용할 값을 입력해 주세요.", true); return; }
                rows.forEach((row) => {
                    const selector = country === "all" ? `[name$="__${field}"]` : `[name="${country}__${field}"]`;
                    row.querySelectorAll(selector).forEach((input) => { if (!input.disabled) input.value = value; });
                });
                showSaveMessage(`${rows.length}개 행에 값을 적용했습니다. 선택 저장을 눌러 반영하세요.`);
            } else {
                Promise.all(rows.map((row) => saveRow(row))).then(() => showSaveMessage(`${rows.length}개 행을 저장했습니다.`));
            }
            return;
        }
        const button = event.target.closest(".save-row-btn");
        if (!button) return;
        event.preventDefault();
        saveRow(button.closest("tr[data-save-url]"), true);
    });
})();
</script>
</body>
</html>
